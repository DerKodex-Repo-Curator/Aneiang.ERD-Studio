<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24365c"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd18a"/>
      <stop offset="1" stop-color="#e0af68"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆角方形 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 左表卡片（A 的左竖） -->
  <g transform="translate(120 128)">
    <rect width="100" height="280" rx="18" fill="#161a22" stroke="#3a5a9e" stroke-width="6"/>
    <!-- 表头（琥珀色 - PK 主色） -->
    <rect width="100" height="40" rx="15" fill="url(#amber)" opacity=".18"/>
    <rect y="40" width="100" height="2" fill="#3a5a9e"/>
    <!-- 字段行（4 行示意） -->
    <g fill="#5f6b82" opacity=".55">
      <circle cx="22" cy="72" r="7" fill="#e0af68"/>
      <rect x="42" y="66" width="42" height="10" rx="5"/>
      <circle cx="22" cy="108" r="7" fill="#73daca"/>
      <rect x="42" y="102" width="34" height="10" rx="5"/>
      <circle cx="22" cy="144" r="7" fill="#7aa2f7"/>
      <rect x="42" y="138" width="46" height="10" rx="5"/>
      <circle cx="22" cy="180" r="7" opacity=".7"/>
      <rect x="42" y="174" width="38" height="10" rx="5" opacity=".7"/>
      <circle cx="22" cy="216" r="7" opacity=".5"/>
      <rect x="42" y="210" width="30" height="10" rx="5" opacity=".5"/>
    </g>
  </g>

  <!-- 右表卡片（A 的右竖） -->
  <g transform="translate(292 128)">
    <rect width="100" height="280" rx="18" fill="#161a22" stroke="#3a5a9e" stroke-width="6"/>
    <!-- 表头 -->
    <rect width="100" height="40" rx="15" fill="url(#amber)" opacity=".18"/>
    <rect y="40" width="100" height="2" fill="#3a5a9e"/>
    <!-- 字段行 -->
    <g fill="#5f6b82" opacity=".55">
      <circle cx="22" cy="72" r="7" fill="#e0af68"/>
      <rect x="42" y="66" width="42" height="10" rx="5"/>
      <circle cx="22" cy="108" r="7" fill="#73daca"/>
      <rect x="42" y="102" width="34" height="10" rx="5"/>
      <circle cx="22" cy="144" r="7" fill="#7aa2f7"/>
      <rect x="42" y="138" width="46" height="10" rx="5"/>
      <circle cx="22" cy="180" r="7" opacity=".7"/>
      <rect x="42" y="174" width="38" height="10" rx="5" opacity=".7"/>
      <circle cx="22" cy="216" r="7" opacity=".5"/>
      <rect x="42" y="210" width="30" height="10" rx="5" opacity=".5"/>
    </g>
  </g>

  <!-- A 字顶部连接（两表汇聚成尖顶） -->
  <path d="M170 128 L256 60 L342 128"
        fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 关系连线（A 的横杠，带 crow's foot 端点） -->
  <g filter="url(#glow)">
    <!-- 主连线 -->
    <line x1="220" y1="232" x2="292" y2="232" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <!-- 左端点（多端：三叉 crow's foot） -->
    <path d="M220 220 l-16 -10 M220 232 l-18 0 M220 244 l-16 10"
          stroke="#7aa2f7" stroke-width="6" stroke-linecap="round"/>
    <!-- 右端点（一端：单竖线） -->
    <line x1="292" y1="220" x2="292" y2="244" stroke="#7dcfff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 底部：关系菱形标记 -->
  <g transform="translate(256 420)">
    <rect x="-26" y="-26" width="52" height="52" rx="8"
          fill="none" stroke="#7aa2f7" stroke-width="4" opacity=".45"
          transform="rotate(45)"/>
  </g>
</svg>
