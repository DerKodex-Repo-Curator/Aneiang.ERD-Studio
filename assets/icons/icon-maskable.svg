<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24365c"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd18a"/>
      <stop offset="1" stop-color="#e0af68"/>
    </linearGradient>
  </defs>

  <!-- maskable：全出血背景，内容保持在安全区内（缩放 0.8） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <!-- 左表卡片 -->
    <g transform="translate(124 132)">
      <rect width="96" height="272" rx="18" fill="#161a22" stroke="#3a5a9e" stroke-width="7"/>
      <rect width="96" height="42" rx="15" fill="url(#amber)" opacity=".2"/>
      <rect y="42" width="96" height="2" fill="#3a5a9e"/>
      <circle cx="22" cy="78" r="9" fill="#e0af68"/>
      <rect x="44" y="71" width="38" height="12" rx="6" fill="#5f6b82" opacity=".7"/>
      <circle cx="22" cy="118" r="9" fill="#73daca"/>
      <rect x="44" y="111" width="30" height="12" rx="6" fill="#5f6b82" opacity=".6"/>
      <circle cx="22" cy="158" r="9" fill="#7aa2f7"/>
      <rect x="44" y="151" width="40" height="12" rx="6" fill="#5f6b82" opacity=".5"/>
      <circle cx="22" cy="198" r="9" fill="#5f6b82" opacity=".5"/>
      <rect x="44" y="191" width="34" height="12" rx="6" fill="#5f6b82" opacity=".4"/>
    </g>
    <!-- 右表卡片 -->
    <g transform="translate(292 132)">
      <rect width="96" height="272" rx="18" fill="#161a22" stroke="#3a5a9e" stroke-width="7"/>
      <rect width="96" height="42" rx="15" fill="url(#amber)" opacity=".2"/>
      <rect y="42" width="96" height="2" fill="#3a5a9e"/>
      <circle cx="22" cy="78" r="9" fill="#e0af68"/>
      <rect x="44" y="71" width="38" height="12" rx="6" fill="#5f6b82" opacity=".7"/>
      <circle cx="22" cy="118" r="9" fill="#73daca"/>
      <rect x="44" y="111" width="30" height="12" rx="6" fill="#5f6b82" opacity=".6"/>
      <circle cx="22" cy="158" r="9" fill="#7aa2f7"/>
      <rect x="44" y="151" width="40" height="12" rx="6" fill="#5f6b82" opacity=".5"/>
      <circle cx="22" cy="198" r="9" fill="#5f6b82" opacity=".5"/>
      <rect x="44" y="191" width="34" height="12" rx="6" fill="#5f6b82" opacity=".4"/>
    </g>
    <!-- A 字顶部连接 -->
    <path d="M172 132 L256 64 L340 132"
          fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 关系连线 -->
    <line x1="220" y1="236" x2="292" y2="236" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M220 222 l-18 -12 M220 236 l-20 0 M220 250 l-18 12"
          stroke="#7aa2f7" stroke-width="7" stroke-linecap="round"/>
    <line x1="292" y1="222" x2="292" y2="250" stroke="#7dcfff" stroke-width="7" stroke-linecap="round"/>
    <!-- 底部菱形 -->
    <g transform="translate(256 424)">
      <rect x="-24" y="-24" width="48" height="48" rx="7"
            fill="none" stroke="#7aa2f7" stroke-width="5" opacity=".5"
            transform="rotate(45)"/>
    </g>
  </g>
</svg>
