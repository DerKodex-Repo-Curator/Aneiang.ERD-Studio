<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="Aneiang ERD Studio — 数据库 ER 图在线设计平台，纯前端、离线可用、可私有部署">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>Aneiang ERD Studio · 数据库 ER 图在线设计平台</title>
<link rel="stylesheet" href="assets/css/icons.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/canvas.css">
</head>
<body>

<!-- ============ 顶部工具栏 ============ -->
<header>
  <div class="brand">
    <span class="logo"><i class="ri-flow-chart"></i></span>
    <div class="tt"><b>Aneiang ERD Studio</b><small data-i18n data-i18n-zh="数据库 ER 图在线设计 · 纯前端 · 离线可用" data-i18n-en="Online ER diagram designer · pure frontend · offline"></small></div>
  </div>

  <div class="proj-wrap">
    <button class="btn project-btn" id="btn-project" data-i18n data-i18n-attr="title" data-i18n-zh="切换 / 管理工程" data-i18n-en="Switch / manage project"><i class="ri-database-2-line"></i><span class="pname" id="proj-name">工程</span><i class="ri-arrow-down-s-line"></i></button>
    <button class="btn" id="btn-newproj" data-i18n data-i18n-attr="title" data-i18n-zh="新建工程" data-i18n-en="New Project"><i class="ri-add-circle-line"></i><span class="btxt" data-i18n data-i18n-zh="新建工程" data-i18n-en="New Project"></span></button>
  </div>

  <span class="hsep"></span>

  <button class="btn" id="btn-newtable" data-i18n data-i18n-attr="title" data-i18n-zh="新建表（N）" data-i18n-en="New Table (N)"><i class="ri-table-line"></i><span class="btxt" data-i18n data-i18n-zh="新建表" data-i18n-en="New Table"></span></button>
  <button class="btn icon" id="btn-undo" data-i18n data-i18n-attr="title" data-i18n-zh="撤销（Ctrl+Z）" data-i18n-en="Undo (Ctrl+Z)" disabled><i class="ri-arrow-go-back-line"></i></button>
  <button class="btn icon" id="btn-redo" data-i18n data-i18n-attr="title" data-i18n-zh="重做（Ctrl+Y）" data-i18n-en="Redo (Ctrl+Y)" disabled><i class="ri-arrow-go-forward-line"></i></button>

  <span class="hsep"></span>

  <div class="search-wrap">
    <div class="search-box">
      <i class="ri-search-line"></i>
      <input id="search" data-i18n data-i18n-attr="placeholder" data-i18n-zh="搜索表 / 字段…（Ctrl+F）" data-i18n-en="Search tables / fields… (Ctrl+F)" autocomplete="off">
    </div>
  </div>

  <button class="btn" id="btn-file" data-menu data-i18n data-i18n-attr="title" data-i18n-zh="文件：打开/保存本地文件、导入、分享链接、类型库" data-i18n-en="File: open/save, import, share, types"><i class="ri-folder-2-line"></i><span class="btxt" data-i18n data-i18n-zh="文件" data-i18n-en="File"></span><i class="ri-arrow-down-s-line"></i></button>
  <button class="btn" id="btn-export" data-menu data-i18n data-i18n-attr="title" data-i18n-zh="导出" data-i18n-en="Export"><i class="ri-download-2-line"></i><span class="btxt" data-i18n data-i18n-zh="导出" data-i18n-en="Export"></span><i class="ri-arrow-down-s-line"></i></button>
  <button class="btn" id="btn-tools" data-menu data-i18n data-i18n-attr="title" data-i18n-zh="工具：连线模式 / 业务域 / 折叠" data-i18n-en="Tools: connect / zones / fold"><i class="ri-tools-line"></i><span class="btxt" data-i18n data-i18n-zh="工具" data-i18n-en="Tools"></span><i class="ri-arrow-down-s-line"></i></button>

  <span class="hsep"></span>

  <a class="btn icon" id="btn-issue" href="https://github.com/AneiangSoft/Aneiang.ERD-Studio/issues" target="_blank" rel="noopener" title="Report an issue" data-i18n data-i18n-attr="title" data-i18n-zh="反馈问题 / 提 Issue" data-i18n-en="Report an issue / open an Issue"><i class="ri-error-warning-line"></i></a>
  <a class="btn" id="btn-star" href="https://github.com/AneiangSoft/Aneiang.ERD-Studio" target="_blank" rel="noopener" title="Star on GitHub" data-i18n data-i18n-attr="title" data-i18n-zh="在 GitHub 上为本项目点星" data-i18n-en="Star this project on GitHub"><i class="ri-star-line"></i><span class="star-cnt" id="star-cnt"></span></a>
  <button class="btn icon" id="btn-help" data-i18n data-i18n-attr="title" data-i18n-zh="帮助" data-i18n-en="Help"><i class="ri-question-line"></i></button>
</header>

<!-- ============ 画布 ============ -->
<div id="viewport">
  <div id="canvas">
    <svg id="edges"></svg>
  </div>
  <div id="minimap" data-i18n data-i18n-attr="title" data-i18n-zh="迷你地图：点击/拖动跳转视图" data-i18n-en="Mini-map: click/drag to jump the view"><canvas id="mm-canvas" width="170" height="120"></canvas></div>
  <div id="empty-tip">
    <div class="tip-card">
      <div class="tip-logo"><i class="ri-flow-chart"></i></div>
      <div class="tip-title">Aneiang ERD Studio<span class="tip-ver" id="tip-ver"></span></div>
      <div class="tip-sub" data-i18n data-i18n-zh="画布还是空的，从下面开始创建你的数据库设计" data-i18n-en="Canvas is empty — start your database design below"></div>
      <div class="tip-actions">
        <button class="btn primary" data-act="newproj"><i class="ri-add-circle-line"></i><span data-i18n data-i18n-zh="新建工程" data-i18n-en="New Project"></span></button>
        <button class="btn" data-act="newtable"><i class="ri-table-line"></i><span data-i18n data-i18n-zh="新建表" data-i18n-en="New Table"></span></button>
        <button class="btn" data-act="import"><i class="ri-upload-2-line"></i><span data-i18n data-i18n-zh="导入 SQL / JSON" data-i18n-en="Import SQL / JSON"></span></button>
        <button class="btn" data-act="sample"><i class="ri-database-2-line"></i><span data-i18n data-i18n-zh="载入演示示例" data-i18n-en="Load Sample"></span></button>
        <button class="btn" data-act="open"><i class="ri-folder-open-line"></i><span data-i18n data-i18n-zh="打开本地文件" data-i18n-en="Open Local File"></span></button>
      </div>
      <div class="tip-hint" data-i18n data-i18n-zh="双击空白处或按 N 也可快速新建表" data-i18n-en="Double-click the canvas or press N to quickly add a table"></div>
    </div>
  </div>
</div>

<!-- ============ 浮动视图控制 ============ -->
<div id="viewbar">
  <button class="btn sm icon" id="btn-zout" data-i18n data-i18n-attr="title" data-i18n-zh="缩小（-）" data-i18n-en="Zoom out (-)"><i class="ri-subtract-line"></i></button>
  <span class="zoom-ind" id="zoom-ind">100%</span>
  <button class="btn sm icon" id="btn-zin" data-i18n data-i18n-attr="title" data-i18n-zh="放大（+）" data-i18n-en="Zoom in (+)"><i class="ri-add-line"></i></button>
  <button class="btn sm icon" id="btn-fit" data-i18n data-i18n-attr="title" data-i18n-zh="适配窗口（F）" data-i18n-en="Fit to window (F)"><i class="ri-fullscreen-line"></i></button>
  <span class="hsep" style="height:18px"></span>
  <button class="btn sm icon" id="btn-theme" data-menu data-i18n data-i18n-attr="title" data-i18n-zh="外观：界面主题 / 画布背景 / 连线样式" data-i18n-en="Appearance: theme / background / edge style"><i class="ri-brush-line"></i></button>
  <button class="btn sm" id="btn-logical" data-i18n data-i18n-attr="title" data-i18n-zh="显示/隐藏逻辑关联（虚线）" data-i18n-en="Toggle logical relations (dashed)"><i class="ri-eye-off-line"></i><span data-i18n data-i18n-zh="逻辑关联" data-i18n-en="Logical"></span></button>
  <button class="btn sm" id="btn-layout" data-i18n data-i18n-attr="title" data-i18n-zh="按业务域自动排列" data-i18n-en="Auto layout by zone"><i class="ri-layout-grid-line"></i><span data-i18n data-i18n-zh="自动布局" data-i18n-en="Layout"></span></button>
</div>

<!-- ============ 图例 ============ -->
<div id="legend"></div>

<!-- ============ 右侧属性面板 ============ -->
<div id="dock">
  <div class="dock-head">
    <i id="dock-head-icon" class="ri-table-line zone-dot"></i>
    <div class="tname" id="dock-head-info"></div>
    <button class="btn sm icon" id="dock-close" data-i18n data-i18n-attr="title" data-i18n-zh="关闭（Esc）" data-i18n-en="Close (Esc)"><i class="ri-close-line"></i></button>
  </div>
  <div id="dock-body"></div>
</div>

<!-- ============ 底部状态栏 ============ -->
<div id="statusbar">
  <div class="stats">
    <span class="stat" data-i18n data-i18n-attr="title" data-i18n-zh="工程数" data-i18n-en="Projects"><i class="ri-database-2-line"></i><b id="st-proj">0</b></span>
    <span class="stat" data-i18n data-i18n-attr="title" data-i18n-zh="表" data-i18n-en="Tables"><i class="ri-table-line"></i><b id="st-t">0</b></span>
    <span class="stat" data-i18n data-i18n-attr="title" data-i18n-zh="字段" data-i18n-en="Columns"><i class="ri-list-ordered"></i><b id="st-c">0</b></span>
    <span class="stat" data-i18n data-i18n-attr="title" data-i18n-zh="物理外键" data-i18n-en="Physical FKs"><i class="ri-link"></i><b id="st-fk">0</b></span>
    <span class="stat" data-i18n data-i18n-attr="title" data-i18n-zh="逻辑关联" data-i18n-en="Logical relations"><i class="ri-link-unlink"></i><b id="st-lg">0</b></span>
  </div>
  <span id="save-state"><span class="dot"></span><span data-i18n data-i18n-zh="自动保存已开启" data-i18n-en="Auto-save on"></span></span>
  <span id="status-hint" data-i18n data-i18n-zh="拖拽平移 · 滚轮缩放 · 双击空白建表 · 右键快捷菜单 · N 新建表 · 双击表折叠" data-i18n-en="Drag to pan · Wheel to zoom · Double-click canvas to add · Right-click menu · N new table · Double-click to fold"></span>
  <span id="footer-oss">
    <a class="fo-link" href="https://github.com/AneiangSoft/Aneiang.ERD-Studio" target="_blank" rel="noopener"><i class="ri-git-branch-line"></i>GitHub</a>
    <a class="fo-link gitee" href="https://gitee.com/aneiangsoft/aneiang.erd-studio" target="_blank" rel="noopener"><i class="ri-book-2-line"></i>Gitee</a>
    <a class="fo-link" href="https://github.com/AneiangSoft/Aneiang.ERD-Studio/issues" target="_blank" rel="noopener"><i class="ri-error-warning-line"></i><span data-i18n data-i18n-zh="反馈" data-i18n-en="Issue"></span></a>
    <span class="fo-meta"><b id="foot-ver"></b> · MIT</span>
  </span>
</div>

<!-- ============ 弹层 ============ -->
<div id="toast-wrap"></div>
<div id="modal-mask"></div>

<datalist id="dl-types">
  <option value="bigint"></option><option value="bigserial"></option><option value="int"></option>
  <option value="smallint"></option><option value="numeric(5,2)"></option><option value="numeric(10,2)"></option>
  <option value="varchar(20)"></option><option value="varchar(40)"></option><option value="varchar(50)"></option>
  <option value="varchar(100)"></option><option value="varchar(200)"></option><option value="varchar(500)"></option>
  <option value="text"></option><option value="bool"></option><option value="date"></option>
  <option value="timestamptz"></option><option value="timestamp"></option><option value="jsonb"></option>
  <option value="varchar[]"></option><option value="int[]"></option>
</datalist>

<script src="assets/js/store.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/sql.js"></script>
<script src="assets/js/io.js"></script>
<script src="assets/js/sample.js"></script>
<script src="assets/js/presets.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/interact.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/ctxmenu.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
